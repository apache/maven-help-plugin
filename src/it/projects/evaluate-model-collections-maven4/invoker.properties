# MPH-210 / #327: Maven 4 resource models contain immutable collections and
# maps that must be serialized without reflection.
invoker.goals.1 = ${project.groupId}:${project.artifactId}:${project.version}:evaluate
invoker.goals.2 = ${project.groupId}:${project.artifactId}:${project.version}:evaluate -Dexpression=project.build.resources[0] -Doutput=resource.xml
invoker.goals.3 = ${project.groupId}:${project.artifactId}:${project.version}:evaluate -Dexpression=project.build -Doutput=build.xml
invoker.goals.4 = ${project.groupId}:${project.artifactId}:${project.version}:evaluate -Dexpression=project.build.resources[1].includes -Doutput=empty.xml
invoker.goals.5 = ${project.groupId}:${project.artifactId}:${project.version}:evaluate -Dexpression=project.build.pluginsAsMap -Doutput=plugins.xml
invoker.maven.version = 4+
